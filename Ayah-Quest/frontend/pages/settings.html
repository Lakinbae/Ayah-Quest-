<div class="space-y-4">
  <div class="flex items-center justify-between">
    <div>
      <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400">CONFIG</span>
      <h2 class="text-lg font-extrabold text-stone-900 dark:text-stone-100">Settings</h2>
    </div>
  </div>

  <div class="bg-white dark:bg-stone-900 p-4 rounded-2xl border border-stone-200 dark:border-stone-800 space-y-3 text-xs">
    <div class="flex items-center justify-between">
      <span>Auto-play Next Ayah</span>
      <input type="checkbox" id="settingAutoNext" checked class="w-4 h-4 text-emerald-600 rounded">
    </div>
    <div class="flex items-center justify-between">
      <span>Show English Translation</span>
      <input type="checkbox" id="settingShowTranslation" checked class="w-4 h-4 text-emerald-600 rounded">
    </div>
    <div class="flex items-center justify-between">
      <span>Daily Revision Reminders</span>
      <input type="checkbox" id="settingReminders" checked class="w-4 h-4 text-emerald-600 rounded">
    </div>
  </div>

  <div class="bg-white dark:bg-stone-900 p-4 rounded-2xl border border-stone-200 dark:border-stone-800 space-y-2">
    <h3 class="text-xs font-bold text-stone-900 dark:text-stone-100">Storage & Cache</h3>
    <button id="btnClearLocalCache" class="w-full py-2.5 rounded-xl bg-stone-100 dark:bg-stone-800 text-stone-700 dark:text-stone-300 text-xs font-medium">
      Clear Cached Audio & Reset Local Progress
    </button>
  </div>
</div>
