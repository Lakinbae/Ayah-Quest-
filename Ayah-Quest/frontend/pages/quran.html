<div class="space-y-4">
  <!-- Quran Reader Header -->
  <div class="flex items-center justify-between">
    <div>
      <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400">MUSHAF READER</span>
      <h2 class="text-lg font-extrabold text-stone-900 dark:text-stone-100" id="mushafSurahName">Surah Al-Mulk</h2>
    </div>
    <!-- Surah Select Dropdown -->
    <select id="mushafSurahSelect" class="bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-xl px-3 py-1.5 text-xs font-semibold text-stone-800 dark:text-stone-200">
      <option value="1">1. Al-Fatihah</option>
      <option value="67" selected>67. Al-Mulk</option>
      <option value="78">78. An-Naba</option>
      <option value="112">112. Al-Ikhlas</option>
      <option value="113">113. Al-Falaq</option>
      <option value="114">114. An-Nas</option>
    </select>
  </div>

  <!-- Bismillah Header -->
  <div class="text-center py-4 bg-emerald-500/5 dark:bg-emerald-950/20 rounded-2xl border border-emerald-500/10">
    <p class="font-quran text-2xl text-emerald-900 dark:text-emerald-300" dir="rtl">
      بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
    </p>
  </div>

  <!-- Ayahs List Container -->
  <div id="mushafAyahsContainer" class="space-y-4">
    <!-- Dynamic verses loaded via JS -->
  </div>
</div>
