<div class="space-y-4">
  <div class="flex items-center justify-between">
    <div>
      <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400">ACTIVE RECALL</span>
      <h2 class="text-lg font-extrabold text-stone-900 dark:text-stone-100">Ayah Quiz Practice</h2>
    </div>
    <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-600">
      Supporting Tool
    </span>
  </div>

  <div id="quizContainer" class="bg-white dark:bg-stone-900 p-5 rounded-3xl border border-stone-200 dark:border-stone-800 shadow-sm space-y-4">
    <div class="flex justify-between items-center text-xs text-stone-400">
      <span>Question <span id="quizQuestionNumber">1</span> of 5</span>
      <span>Score: <span id="quizScoreText" class="font-bold text-emerald-600">0</span></span>
    </div>

    <div class="text-center py-4 bg-stone-50 dark:bg-stone-850 rounded-2xl p-4">
      <p class="text-xs text-stone-500 dark:text-stone-400 mb-2">Identify the missing word in this verse:</p>
      <p id="quizVerseText" class="font-quran text-xl text-stone-900 dark:text-stone-100" dir="rtl">
        تَبَارَكَ الَّذِي بِيَدِهِ ________ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
      </p>
    </div>

    <!-- Quiz Options -->
    <div id="quizOptionsGrid" class="grid grid-cols-2 gap-2">
      <button class="quiz-opt-btn p-3 rounded-xl bg-stone-100 dark:bg-stone-800 hover:bg-emerald-50 dark:hover:bg-emerald-950 font-quran text-lg text-stone-800 dark:text-stone-100 border border-stone-200 dark:border-stone-700 transition-all" dir="rtl">
        الْمُلْكُ
      </button>
      <button class="quiz-opt-btn p-3 rounded-xl bg-stone-100 dark:bg-stone-800 hover:bg-emerald-50 dark:hover:bg-emerald-950 font-quran text-lg text-stone-800 dark:text-stone-100 border border-stone-200 dark:border-stone-700 transition-all" dir="rtl">
        الْحَمْدُ
      </button>
      <button class="quiz-opt-btn p-3 rounded-xl bg-stone-100 dark:bg-stone-800 hover:bg-emerald-50 dark:hover:bg-emerald-950 font-quran text-lg text-stone-800 dark:text-stone-100 border border-stone-200 dark:border-stone-700 transition-all" dir="rtl">
        الْخَلْقُ
      </button>
      <button class="quiz-opt-btn p-3 rounded-xl bg-stone-100 dark:bg-stone-800 hover:bg-emerald-50 dark:hover:bg-emerald-950 font-quran text-lg text-stone-800 dark:text-stone-100 border border-stone-200 dark:border-stone-700 transition-all" dir="rtl">
        الْعَظِيمُ
      </button>
    </div>

    <div id="quizFeedback" class="hidden p-3 rounded-xl text-xs text-center font-bold"></div>
  </div>
</div>
