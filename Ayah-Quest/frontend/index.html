<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>آيَة | Ayah Quest</title>
  <meta name="description" content="Quran Hifz and memorization companion with audio loops, active recall, and smart SRS review.">
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS via CDN for standalone standalone package -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            emerald: {
              850: '#064e3b',
              900: '#022c22',
              950: '#011c15'
            },
            stone: {
              850: '#141210',
              950: '#0a0908'
            },
            gold: {
              400: '#f6d860',
              500: '#e5b83b',
              600: '#c69225'
            }
          }
        }
      }
    }
  </script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-quran {
      font-family: 'Scheherazade New', 'Amiri', serif;
      line-height: 2.2;
    }
  </style>
</head>
<body class="bg-stone-50 dark:bg-stone-950 text-stone-800 dark:text-stone-100 min-h-screen flex flex-col pb-20 select-none">
  
  <!-- Top App Header -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-stone-900/90 backdrop-blur-md border-b border-stone-200 dark:border-stone-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-emerald-700 flex items-center justify-center text-white font-serif font-bold text-lg shadow-sm">
        آ
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-emerald-900 dark:text-emerald-400">آيَة <span class="text-stone-400 font-normal">|</span> Ayah Quest</h1>
        <p class="text-[10px] text-stone-500 dark:text-stone-400 font-medium">Quran Hifz & Review Companion</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="streakBtn" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-600 dark:text-amber-400 text-xs font-semibold">
        <span>🔥</span>
        <span id="headerStreakVal">4</span>
      </button>
      <button id="proBadgeBtn" class="px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 text-xs font-bold tracking-wide">
        PRO
      </button>
    </div>
  </header>

  <!-- Dynamic Page Content Container -->
  <main id="appContent" class="flex-1 max-w-lg w-full mx-auto p-4 transition-opacity duration-200">
    <!-- Rendered dynamically by app.js router -->
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white/95 dark:bg-stone-900/95 backdrop-blur-lg border-t border-stone-200 dark:border-stone-800 py-1.5 px-3">
    <div class="max-w-lg mx-auto grid grid-cols-5 gap-1">
      <button data-nav="home" class="nav-btn flex flex-col items-center py-1 rounded-xl text-emerald-600 dark:text-emerald-400 font-medium text-[11px] transition-all">
        <span class="text-lg mb-0.5">🏠</span>
        <span>Home</span>
      </button>
      <button data-nav="hifz" class="nav-btn flex flex-col items-center py-1 rounded-xl text-stone-500 dark:text-stone-400 font-medium text-[11px] transition-all">
        <span class="text-lg mb-0.5">🎧</span>
        <span>Hifz</span>
      </button>
      <button data-nav="quran" class="nav-btn flex flex-col items-center py-1 rounded-xl text-stone-500 dark:text-stone-400 font-medium text-[11px] transition-all">
        <span class="text-lg mb-0.5">📖</span>
        <span>Quran</span>
      </button>
      <button data-nav="progress" class="nav-btn flex flex-col items-center py-1 rounded-xl text-stone-500 dark:text-stone-400 font-medium text-[11px] transition-all">
        <span class="text-lg mb-0.5">📊</span>
        <span>Progress</span>
      </button>
      <button data-nav="profile" class="nav-btn flex flex-col items-center py-1 rounded-xl text-stone-500 dark:text-stone-400 font-medium text-[11px] transition-all">
        <span class="text-lg mb-0.5">👤</span>
        <span>Profile</span>
      </button>
    </div>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
